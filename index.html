    <script>
      // Suppress unhandled errors from external third-party browser extensions (MetaMask, Phantom, etc.)
      (function() {
        function isExtensionError(msg, src, stack) {
          var str = [msg, src, stack].join(' ').toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('moz-extension://') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('ethereum') !== -1
          );
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          var stack = (reason && reason.stack) || '';
          if (isExtensionError(msg, '', stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var src = event.filename || '';
          var stack = (event.error && event.error.stack) || '';
          if (isExtensionError(msg, src, stack)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
